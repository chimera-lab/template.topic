name: Organization
description: Suggest improvements to topic organization
title: "[ORG]: "
labels: ["organization", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest how to better organize this topic.
  
  - type: textarea
    id: suggestion
    attributes:
      label: Organization Suggestion
      description: Describe your suggestion for better organization
    validations:
      required: true
  
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why would this improve the topic organization?
    validations:
      required: true
